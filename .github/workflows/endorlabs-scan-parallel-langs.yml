name: Endor Labs Scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      java-x-pack: ${{ steps.filter.outputs.java-x-pack }}
      java-distribution: ${{ steps.filter.outputs.java-distribution }}
      java-modules: ${{ steps.filter.outputs.java-modules }}
      java-libs: ${{ steps.filter.outputs.java-libs }}
      java-qa: ${{ steps.filter.outputs.java-qa }}
      java-plugins: ${{ steps.filter.outputs.java-plugins }}
      java-build-tools-internal: ${{ steps.filter.outputs.java-build-tools-internal }}
      java-other: ${{ steps.filter.outputs.java-other }}
      javascript-typescript: ${{ steps.filter.outputs.javascript-typescript }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |-
            java-x-pack:
              - x-pack/**/'**/pom.xml'
              - x-pack/**/'**/build.gradle'
              - x-pack/**/'**/build.gradle.kts'
              - x-pack/**/'**/*.java'
            java-distribution:
              - distribution/**/'**/pom.xml'
              - distribution/**/'**/build.gradle'
              - distribution/**/'**/build.gradle.kts'
              - distribution/**/'**/*.java'
            java-modules:
              - modules/**/'**/pom.xml'
              - modules/**/'**/build.gradle'
              - modules/**/'**/build.gradle.kts'
              - modules/**/'**/*.java'
            java-libs:
              - libs/**/'**/pom.xml'
              - libs/**/'**/build.gradle'
              - libs/**/'**/build.gradle.kts'
              - libs/**/'**/*.java'
            java-qa:
              - qa/**/'**/pom.xml'
              - qa/**/'**/build.gradle'
              - qa/**/'**/build.gradle.kts'
              - qa/**/'**/*.java'
            java-plugins:
              - plugins/**/'**/pom.xml'
              - plugins/**/'**/build.gradle'
              - plugins/**/'**/build.gradle.kts'
              - plugins/**/'**/*.java'
            java-build-tools-internal:
              - build-tools-internal/**/'**/pom.xml'
              - build-tools-internal/**/'**/build.gradle'
              - build-tools-internal/**/'**/build.gradle.kts'
              - build-tools-internal/**/'**/*.java'
            java-other:
              - '**/pom.xml'
              - '**/build.gradle'
              - '**/build.gradle.kts'
              - '**/*.java'
            javascript-typescript:
              - '**/package.json'
              - '**/package-lock.json'
              - '**/yarn.lock'
              - '**/pnpm-lock.yaml'
              - '**/rush.json'
              - '**/*.js'
              - '**/*.ts'
              - '**/*.tsx'
            rust:
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/*.rs'
  scan-java-x-pack-pr:
    name: "PR Scan: java (x-pack)"
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.java-x-pack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew build -x test
      - uses: endorlabs/github-action@b8992820cc4d9c9e7ded5022adf6cabe2dc11946
        with:
          namespace: "endor-solutions-ypulse.github-ci.saber-e2e"
          scan_dependencies: true
          pr: true
          enable_pr_comments: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          enable_github_action_token: true
          additional_args: "--languages=java --include-path=x-pack/** --exclude-path=test/** --exclude-path=client/test/** --exclude-path=qa/evil-tests/** --exclude-path=qa/no-bootstrap-tests/** --exclude-path=x-pack/test/** --quick-scan"
